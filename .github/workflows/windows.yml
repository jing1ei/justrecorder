name: Windows
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            architecture: x64
          - runtime: win-x86
            architecture: x86
          - runtime: win-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify packaging failure paths
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./Tests/test_windows_package.ps1
      - name: Ensure Windows media codecs are available
        if: matrix.runtime != 'win-arm64'
        # Get-WindowsFeature / Install-WindowsFeature live in the ServerManager module,
        # which only ships with Windows PowerShell (powershell.exe), not PowerShell 7
        # (pwsh, the Actions default on windows runners).
        shell: powershell
        run: |
          Import-Module ServerManager
          $feature = Get-WindowsFeature -Name Server-Media-Foundation
          if (-not $feature.Installed) {
            $result = Install-WindowsFeature -Name Server-Media-Foundation
            if (-not $result.Success -or $result.RestartNeeded -eq 'Yes') {
              throw 'Media Foundation could not be enabled without a restart.'
            }
          }
      - name: Test and package
        shell: pwsh
        run: ./Windows/build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Name Windows package
        shell: pwsh
        run: Copy-Item "build/windows/${{ matrix.runtime }}.zip" "build/windows/JustRecorder-1.0.0-Windows-${{ matrix.architecture }}.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: JustRecorder-1.0.0-Windows-${{ matrix.architecture }}
          if-no-files-found: error
          compression-level: 0
          path: build/windows/JustRecorder-1.0.0-Windows-${{ matrix.architecture }}.zip
