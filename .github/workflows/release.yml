name: Release
# Build and verify every platform, then publish one immutable version.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Never publish two builds concurrently, and do not cancel an in-flight publication
# while all verified platform artifacts are being published.
concurrency:
  group: release-publish
  cancel-in-progress: false
jobs:
  macos:
    uses: ./.github/workflows/macos.yml
  windows:
    uses: ./.github/workflows/windows.yml
  publish:
    name: Publish release
    needs: [macos, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: JustRecorder-*
          merge-multiple: true
          path: assets
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py assets
