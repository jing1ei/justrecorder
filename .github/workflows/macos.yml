name: macOS
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  intel-tests:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./test.sh x86_64
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify source package
        run: |
          python3 Tests/test_source_release.py
          python3 .github/scripts/test_release.py
      - name: Run audio and naming regressions (Apple silicon)
        run: ./test.sh arm64
      - name: Build Intel and Apple silicon app
        run: ./build.sh --universal
      - name: Package and verify downloads
        shell: bash
        run: |
          python3 source-release.py
          codesign --verify --strict build/JustRecorder.app
          test -s build/JustRecorder.app/Contents/Resources/AppIcon.icns
          ditto -c -k --keepParent build/JustRecorder.app build/JustRecorder-1.0.0-macOS-universal.zip
          unzip -tq build/JustRecorder-1.0.0-macOS-universal.zip
          unzip -tq build/JustRecorder-1.0.0-source.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: JustRecorder-1.0.0-macOS-universal
          if-no-files-found: error
          compression-level: 0
          path: |
            build/JustRecorder-1.0.0-macOS-universal.zip
            build/JustRecorder-1.0.0-source.zip
