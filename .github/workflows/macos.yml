name: macOS
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  intel-tests:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./test.sh x86_64
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Read application version
        id: version
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, plistlib
          version = plistlib.loads(pathlib.Path('Resources/Info.plist').read_bytes())['CFBundleShortVersionString']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PYTHON
      - name: Verify source package
        run: |
          python3 Tests/test_source_release.py
          python3 .github/scripts/test_release.py
      - name: Run audio and naming regressions (Apple silicon)
        run: ./test.sh arm64
      - name: Build Intel and Apple silicon app
        run: ./build.sh --universal
      - name: Package and verify downloads
        shell: bash
        run: |
          python3 source-release.py
          codesign --verify --strict build/JustRecorder.app
          test -s build/JustRecorder.app/Contents/Resources/AppIcon.icns
          for arch in arm64 x64; do
            .github/scripts/package-macos.sh build/JustRecorder.app ${{ steps.version.outputs.version }} "$arch" build/downloads
          done
          unzip -tq build/JustRecorder-${{ steps.version.outputs.version }}-source.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: JustRecorder-${{ steps.version.outputs.version }}-macOS
          if-no-files-found: error
          compression-level: 0
          path: |
            build/downloads/*.dmg
            build/JustRecorder-${{ steps.version.outputs.version }}-source.zip
